services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NEXUS_DB: /data/arena.sqlite3
    volumes:
      - ./data:/data
    expose:
      - '8000'
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  caddy_data:
  caddy_config:

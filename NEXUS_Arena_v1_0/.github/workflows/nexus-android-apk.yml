name: Build NEXUS Arena APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Get NEXUS Arena source
        uses: actions/checkout@v4

      - name: Java 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter and Android tooling
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check that app sources exist
        run: |
          test -f NEXUS_Arena_v1_0/mobile/pubspec.yaml
          test -f NEXUS_Arena_v1_0/mobile/lib/main.dart
          test -f NEXUS_Arena_v1_0/tools/install_android_icons.py

      - name: Create Android native files
        working-directory: NEXUS_Arena_v1_0/mobile
        run: flutter create --platforms=android --org com.nexusarena .

      - name: Install dependencies
        working-directory: NEXUS_Arena_v1_0/mobile
        run: flutter pub get

      - name: Install icon and internet permission
        run: |
          python3 NEXUS_Arena_v1_0/tools/install_android_icons.py
          sed -i 's/android:label="nexus_arena"/android:label="NEXUS Arena"/' NEXUS_Arena_v1_0/mobile/android/app/src/main/AndroidManifest.xml
          grep 'android.permission.INTERNET' NEXUS_Arena_v1_0/mobile/android/app/src/main/AndroidManifest.xml

      - name: Build installable APK connected to the public site
        working-directory: NEXUS_Arena_v1_0/mobile
        run: flutter build apk --release --dart-define=ARENA_URL=https://nexus-arena-nfx1.onrender.com/

      - name: Prepare downloadable APK
        run: |
          mkdir -p release
          cp NEXUS_Arena_v1_0/mobile/build/app/outputs/flutter-apk/app-release.apk release/NEXUS_Arena_Android.apk
          test -s release/NEXUS_Arena_Android.apk
          sha256sum release/NEXUS_Arena_Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS_Arena_Android_APK
          path: release/NEXUS_Arena_Android.apk
          if-no-files-found: error
          retention-days: 30

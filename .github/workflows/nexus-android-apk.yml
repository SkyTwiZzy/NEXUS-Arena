name: Build NEXUS Arena APK (Fixed)

on:
  workflow_dispatch:
    inputs:
      app_directory:
        description: "Optional: Flutter folder, for example NEXUS_Arena_v1_1_Public/mobile (leave blank for automatic detection)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download GitHub repository
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find Android application or create WebView shell
        shell: bash
        env:
          REQUESTED_APP_DIR: ${{ inputs.app_directory }}
        run: |
          set -euo pipefail
          echo "Repository Flutter projects:"
          find . -type f -name pubspec.yaml -not -path './.git/*' -print || true
          if [[ -n "$REQUESTED_APP_DIR" ]]; then
            APP_DIR="${REQUESTED_APP_DIR#./}"
            if [[ ! -f "$APP_DIR/pubspec.yaml" || ! -f "$APP_DIR/lib/main.dart" ]]; then
              echo "::error::Flutter files not found in $APP_DIR. Leave app_directory empty for automatic detection."
              exit 1
            fi
          else
            mapfile -t CANDIDATES < <(find . -type f -path '*/mobile/pubspec.yaml' -not -path './.git/*' | sort -V)
            APP_DIR=''
            for file in "${CANDIDATES[@]}"; do
              dir="${file%/pubspec.yaml}"
              if [[ -f "$dir/lib/main.dart" ]]; then APP_DIR="${dir#./}"; fi
            done
            if [[ -z "$APP_DIR" ]]; then
              echo "No Flutter mobile folder uploaded. Creating an Android client for NEXUS Arena..."
              APP_DIR="nexus_arena_mobile"
              flutter create --platforms=android --org com.nexusarena "$APP_DIR"
              (
                cd "$APP_DIR"
                flutter pub add webview_flutter webview_flutter_android image_picker url_launcher
              )
              cat > "$APP_DIR/lib/main.dart" <<'DART'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:webview_flutter_android/webview_flutter_android.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:url_launcher/url_launcher.dart';

          const String siteUrl = String.fromEnvironment(
            'ARENA_URL', defaultValue: 'https://nexus-arena-nfx1.onrender.com/');

          void main() { WidgetsFlutterBinding.ensureInitialized(); runApp(const NexusApp()); }

          class NexusApp extends StatelessWidget {
            const NexusApp({super.key});
            @override
            Widget build(BuildContext context) => MaterialApp(
              title: 'NEXUS Arena',
              debugShowCheckedModeBanner: false,
              theme: ThemeData.dark(useMaterial3: true),
              home: const NexusHome(),
            );
          }

          class NexusHome extends StatefulWidget {
            const NexusHome({super.key});
            @override
            State<NexusHome> createState() => _NexusHomeState();
          }

          class _NexusHomeState extends State<NexusHome> {
            late final WebViewController web;
            bool loading = true;
            String? failure;

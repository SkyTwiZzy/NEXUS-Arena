name: Build NEXUS Arena APK (Fixed v2)

on:
  workflow_dispatch:
    inputs:
      app_directory:
        description: "Optional: Flutter folder, for example NEXUS_Arena_v1_1_Public/mobile (leave blank for automatic detection)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download GitHub repository
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find Android application or create WebView shell
        shell: bash
        env:
          REQUESTED_APP_DIR: ${{ inputs.app_directory }}
        run: |
          set -euo pipefail
          echo "Repository Flutter projects:"
          find . -type f -name pubspec.yaml -not -path './.git/*' -print || true
          if [[ -n "$REQUESTED_APP_DIR" ]]; then
            APP_DIR="${REQUESTED_APP_DIR#./}"
            if [[ ! -f "$APP_DIR/pubspec.yaml" || ! -f "$APP_DIR/lib/main.dart" ]]; then
              echo "::error::Flutter files not found in $APP_DIR. Leave app_directory empty for automatic detection."
              exit 1
            fi
          else
            mapfile -t CANDIDATES < <(find . -type f -path '*/mobile/pubspec.yaml' -not -path './.git/*' | sort -V)
            APP_DIR=''
            for file in "${CANDIDATES[@]}"; do
              dir="${file%/pubspec.yaml}"
              if [[ -f "$dir/lib/main.dart" ]]; then APP_DIR="${dir#./}"; fi
            done
            if [[ -z "$APP_DIR" ]]; then
              echo "No Flutter mobile folder uploaded. Generating an Android WebView client for NEXUS Arena..."
              APP_DIR="nexus_arena_mobile"
              flutter create --platforms=android --org com.nexusarena "$APP_DIR"
              (
                cd "$APP_DIR"
                flutter pub add webview_flutter webview_flutter_android image_picker url_launcher
              )
              printf '%s' '' | base64 --decode > "$APP_DIR/lib/main.dart"
            fi
          fi
          echo "Flutter directory: $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Create Android app files and download dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          flutter create --platforms=android --org com.nexusarena .
          flutter pub get

      - name: Configure app icon, name, and internet permission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re, shutil
          root = pathlib.Path.cwd()
          app = root / os.environ['APP_DIR']
          manifest = app / 'android/app/src/main/AndroidManifest.xml'
          text = manifest.read_text(encoding='utf-8')
          text = re.sub(r'android:label="[^"]*"', 'android:label="NEXUS Arena"', text, count=1)
          if 'android.permission.INTERNET' not in text:
              text = text.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          manifest.write_text(text, encoding='utf-8')

          icons = list(root.glob('**/assets/nexus_icon.png'))
          icons += list(root.glob('**/web/icons/icon-192.png'))
          icons += list(root.glob('**/mobile/assets/nexus_icon.png'))
          icons += list(root.glob('**/assets/nexus_icon.png'))
          if icons:
              source = icons[0]
              print('Using NEXUS app icon:', source)
              for density in ('mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi'):
                  target = app / f'android/app/src/main/res/mipmap-{density}/ic_launcher.png'
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, target)
          else:
              print('WARNING: NEXUS logo not found in repository. Default Flutter launcher icon will be used.')
          print('Android app configured.')
          PY

      - name: Build installable NEXUS Arena APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          flutter build apk --release --dart-define='ARENA_URL=https://nexus-arena-nfx1.onrender.com/'

      - name: Verify and upload APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp "$APP_DIR/build/app/outputs/flutter-apk/app-release.apk" release/NEXUS_Arena_Android.apk
          test -s release/NEXUS_Arena_Android.apk
          sha256sum release/NEXUS_Arena_Android.apk

      - name: Downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS_Arena_Android_APK
          path: release/NEXUS_Arena_Android.apk
          if-no-files-found: error
          retention-days: 30
